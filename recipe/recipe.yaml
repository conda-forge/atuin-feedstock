context:
  version: "18.24.6"

package:
  name: atuin
  version: ${{ version }}

source:
  url: https://github.com/atuinsh/atuin/archive/refs/tags/v${{ version }}.tar.gz
  sha256: fdfcaab891ecc33561372d6763b8c279112a0d10c7ddb3a3b464abe039045423

build:
  number: 1
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - libprotobuf
  host:
    - openssl

tests:
  - script:
      - atuin --help
  - if: osx
    then:
      # Frameworks of the objc2 crates atuin uses; objc2 looks their classes up by name,
      # so a missing one only shows up as a panic at runtime
      script:
        - otool -L $PREFIX/bin/atuin
        - for f in AppKit CoreFoundation CoreGraphics Foundation IOKit OpenDirectory Security ServiceManagement SystemConfiguration; do otool -L $PREFIX/bin/atuin | grep -q "/$f.framework/" || { echo "$f.framework is not linked"; exit 1; }; done
      requirements:
        run:
          - cctools

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Improved shell history for zsh and bash
  homepage: https://github.com/atuinsh/atuin
  repository: https://github.com/atuinsh/atuin

extra:
  recipe-maintainers:
    - danielnachun
